<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="api-flow-title api-flow-desc">
  <title id="api-flow-title">How Translation API works</title>
  <desc id="api-flow-desc">A client submits text to Translation API, receives a job ID, and polls for progress while a single worker translates text in chunks through Ollama and keeps the result in memory.</desc>
  <defs>
    <marker id="api-flow-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4f5d75"/>
    </marker>
    <marker id="api-flow-http-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2e5aa8"/>
    </marker>
  </defs>
  <style>
    text { fill: #2d3142; font-family: 'Geist', system-ui, sans-serif; }
    .title { font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; }
    .name { font-size: 16px; font-weight: 600; }
    .body { font-size: 14px; }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; fill: #5a6580; }
    .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 1px; fill: #5a6580; }
    .label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; text-anchor: middle; fill: #2e5aa8; }
    .http { fill: none; stroke: #2e5aa8; stroke-width: 1.5; marker-end: url(#api-flow-http-arrow); }
    .internal { fill: none; stroke: #4f5d75; stroke-width: 1.5; marker-end: url(#api-flow-arrow); }
    .return { stroke-dasharray: 5 4; stroke-width: 1.2; }
  </style>

  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text x="48" y="56" class="eyebrow">TRANSLATION API / DEFAULT OLLAMA BACKEND</text>
  <text x="48" y="108" class="title">Submit once. Poll for the translation.</text>
  <text x="48" y="140" class="body">The API queues the work; the client retrieves progress and the final result using a job ID.</text>

  <rect x="320" y="176" width="592" height="432" rx="8" fill="#ececec" stroke="#bfc0c0"/>
  <text x="352" y="208" class="eyebrow">TRANSLATION API</text>
  <text x="880" y="208" class="mono" text-anchor="end">127.0.0.1:5001</text>

  <!-- Connections precede nodes. Return paths use separate attachment points. -->
  <path d="M 256 272 H 352" class="http"/>
  <path d="M 352 368 H 256" class="http return"/>
  <path d="M 560 288 H 648" class="internal"/>
  <path d="M 648 368 H 560" class="internal return"/>
  <path d="M 880 288 H 984" class="http"/>
  <path d="M 984 368 H 880" class="http return"/>
  <path d="M 160 400 V 456 Q 160 464 168 464 H 408 Q 416 464 416 456 V 400" class="http"/>
  <path d="M 496 400 V 536 Q 496 544 488 544 H 104 Q 96 544 96 536 V 400" class="http return"/>

  <!-- Opaque label masks sit above their connector with an 8px gap. -->
  <rect x="272" y="240" width="64" height="24" fill="#f5f5f5"/>
  <text x="304" y="256" class="label">SUBMIT</text>
  <rect x="272" y="336" width="64" height="24" fill="#f5f5f5"/>
  <text x="304" y="352" class="label">JOB ID</text>
  <rect x="568" y="256" width="72" height="24" fill="#ececec"/>
  <text x="604" y="272" class="label" style="fill:#4f5d75">NEXT JOB</text>
  <rect x="568" y="336" width="72" height="24" fill="#ececec"/>
  <text x="604" y="352" class="label" style="fill:#4f5d75">PROGRESS</text>
  <rect x="900" y="256" width="64" height="24" fill="#f5f5f5"/>
  <text x="932" y="272" class="label">CHAT</text>
  <rect x="900" y="336" width="64" height="24" fill="#f5f5f5"/>
  <text x="932" y="352" class="label">STREAM</text>
  <rect x="240" y="432" width="72" height="24" fill="#f5f5f5"/>
  <text x="276" y="448" class="label">POLL</text>
  <rect x="240" y="512" width="72" height="24" fill="#f5f5f5"/>
  <text x="276" y="528" class="label">RESULT</text>

  <g>
    <rect x="48" y="240" width="208" height="160" rx="6" fill="#e4e5e8" stroke="#5a6580"/>
    <text x="72" y="272" class="eyebrow">CLIENT</text>
    <text x="72" y="308" class="name">App or extension</text>
    <text x="72" y="336" class="body">Text + language choices</text>
    <text x="72" y="376" class="mono">q / source / target</text>
  </g>
  <g>
    <rect x="352" y="240" width="208" height="160" rx="6" fill="#f2e7e3" stroke="#bf4520" stroke-width="1.5"/>
    <text x="376" y="272" class="eyebrow" style="fill:#bf4520">JOBS</text>
    <text x="376" y="308" class="name">Queue + job state</text>
    <text x="376" y="336" class="body">Validate and enqueue</text>
    <text x="376" y="376" class="mono">Up to 8 active jobs</text>
  </g>
  <g>
    <rect x="648" y="240" width="232" height="160" rx="6" fill="#ffffff" stroke="#2d3142"/>
    <text x="672" y="272" class="eyebrow">ONE WORKER</text>
    <text x="672" y="308" class="name">Translate in order</text>
    <text x="672" y="336" class="body">Detect source if automatic</text>
    <text x="672" y="360" class="body">Split text into chunks</text>
    <text x="672" y="384" class="mono">Accumulate partialText</text>
  </g>
  <g>
    <rect x="984" y="240" width="248" height="160" rx="6" fill="#ffffff" stroke="#4f5d75"/>
    <text x="1008" y="272" class="eyebrow">OLLAMA</text>
    <text x="1008" y="308" class="name">translategemma:4b</text>
    <text x="1008" y="336" class="body">Stream translated text</text>
    <text x="1008" y="376" class="mono">127.0.0.1:11434</text>
  </g>

  <text x="352" y="584" class="mono">Job state and results stay in memory; restart clears them.</text>
  <text x="984" y="440" class="mono">Default model and addresses.</text>
  <text x="984" y="464" class="mono">Same source and target?</text>
  <text x="984" y="488" class="mono">Return input without Ollama.</text>

  <text x="48" y="632" class="mono">SUBMIT  POST /translate → 202 + jobId     POLL  GET /translations/&lt;jobId&gt;</text>
  <text x="48" y="656" class="mono">RESULT  pending + partialText → done + translatedText, or failed / cancelled</text>
  <line x1="48" y1="676" x2="1232" y2="676" stroke="#bfc0c0"/>
  <line x1="48" y1="696" x2="80" y2="696" stroke="#2e5aa8" stroke-width="1.5"/>
  <text x="92" y="700" class="mono">HTTP request</text>
  <line x1="256" y1="696" x2="288" y2="696" stroke="#4f5d75" stroke-width="1.5"/>
  <text x="300" y="700" class="mono">Internal work</text>
  <line x1="480" y1="696" x2="512" y2="696" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="524" y="700" class="mono">Response / progress</text>
</svg>
